[package]
name = "protector"
version = "0.1.0"
edition = "2021"

[lib]
name = "protector"
path = "src/lib.rs"

[[bin]]
name = "protector"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
# default-features off: the macro features pull futures-macro, which this
# registry cannot resolve. Only `StreamExt::next` is used.
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "process", "io-util"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
strip = true
