[package]
name = "protector"
version = "0.1.0"
edition = "2021"

[lib]
name = "protector"
path = "src/lib.rs"

[[bin]]
name = "protector"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
keyring = { version = "3", default-features = false, features = ["async-secret-service", "crypto-rust", "async-io"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_urlencoded = "0.7"
sha2 = "0.10"
# default-features off: the macro features pull futures-macro, which this
# registry cannot resolve. Only `StreamExt::next` is used.
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "process", "io-util"] }
toml = "0.8"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
strip = true
